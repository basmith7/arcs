# Unraid deployment - pulls the pre-built image from GHCR (built by
# .github/workflows/docker-publish.yml on a version tag). Deploy
# with scripts/deploy-now.sh <tag> (Tower's shared deploy-app).
services:
  app:
    image: ghcr.io/basmith7/arcs:latest
    container_name: arcs
    ports:
      - "3070:3070"
    environment:
      DATABASE_PATH: "/data/arcs.db"
      PUBLIC_ORIGIN: "https://arcs.basmith.net"
      BOT_PACE_MS: "1000"
      # From a root-only .env next to this compose file on Tower — never committed.
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      DISCORD_CHANNEL_ID: "${DISCORD_CHANNEL_ID:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      PRESENCE_ACTIVE_MS: "${PRESENCE_ACTIVE_MS:-}"
      PING_GRACE_MS: "${PING_GRACE_MS:-}"
      LEAVE_GRACE_MS: "${LEAVE_GRACE_MS:-}"
      # Turn catch-up stories (packages/server-node/src/catchup.ts); empty = bullets only.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    volumes:
      - /mnt/cache/appdata/arcs:/data
    restart: unless-stopped
    labels:
      - "net.unraid.docker.icon=https://raw.githubusercontent.com/basmith7/arcs/main/assets/images/favicon-180.png"
      - "net.unraid.docker.webui=http://[IP]:[PORT:3070]"
